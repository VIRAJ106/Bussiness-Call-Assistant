server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dayclose_inventory}
    username: ${SPRING_DATASOURCE_USERNAME:dayclose}
    password: ${SPRING_DATASOURCE_PASSWORD:dayclose_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:dayclose}
    password: ${RABBITMQ_PASSWORD:dayclose_password}
    publisher-confirm-type: correlated
    publisher-returns: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

dayclose:
  sweeper:
    enabled: true
    interval-ms: 60000
  outbox:
    relay:
      enabled: true
    poll-interval-ms: 500
